included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
  - build

# Formatting (whitespace, wrapping, import order) is owned by swift-format.
# SwiftLint covers code-quality rules on top of that.
disabled_rules:
  - trailing_comma
  - closure_parameter_position
  - opening_brace
  - vertical_parameter_alignment_on_call

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 140
  ignores_comments: true

identifier_name:
  excluded: [q, h, m, f]

type_body_length:
  warning: 300
file_length:
  warning: 500
